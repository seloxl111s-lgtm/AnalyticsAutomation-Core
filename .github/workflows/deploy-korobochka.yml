name: Deploy Korobochka

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: korobochka-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Korobochka
    runs-on:
      - self-hosted
      - linux
      - korobochka

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Show runner
        run: |
          hostname
          whoami
          date

      - name: Deploy
        run: sudo /usr/local/bin/v1-deploy
